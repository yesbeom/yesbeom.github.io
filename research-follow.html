<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Research Follow page for tracking recently published papers in chemistry and semiconducting nanomaterials."
    />
    <title>Research Follow | Seongbeom Yeon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Go to home">
        <span class="brand-mark">SY</span>
        <span>Personal Website</span>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="index.html#research">Research</a>
        <a href="research-follow.html" aria-current="page">Research Follow</a>
        <a href="index.html#projects">Projects</a>
      </nav>
    </header>

    <main>
      <section class="page-hero section-band">
        <div>
          <p class="eyebrow">Research Follow</p>
          <h1>Recently Published Papers</h1>
          <p class="hero-text">
            최근 3일 이내 공개된 논문 중 지정 키워드가 제목에 포함된 논문을 자동으로 표시합니다.
          </p>
        </div>
      </section>

      <section class="section">
        <div class="follow-toolbar">
          <div>
            <p class="eyebrow">Latest Updates</p>
            <h2>Paper watchlist</h2>
          </div>
        </div>

        <div class="follow-status" id="research-follow-status">Loading recent papers...</div>
        <div class="journal-filter" id="journal-filter" aria-label="Filter papers by journal"></div>
        <div class="follow-list" id="research-follow-list" aria-live="polite">
          <article class="loading-card">
            <span class="loading-spinner" aria-hidden="true"></span>
            <div>
              <h3>Loading recent papers...</h3>
              <p>Crossref에서 최근 논문 데이터를 불러오고 있습니다.</p>
            </div>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>&copy; <span id="year"></span> Seongbeom Yeon</span>
      <a href="index.html">Home</a>
    </footer>

    <script type="module" src="js/pages/research-follow-page.js"></script>
  </body>
</html>
